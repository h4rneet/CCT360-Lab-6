<body>

    <div class="container mt-3">
    <form style="max-width: 900px" class="mx-auto">
<div class="row g-4">
<div class="md:col-6">
<div class="form-field">
<label for="firstName" class="form-label">First name</label>
<input type="text" class="form-control" id="firstName">
</div>
</div>
<!-- more fields here -->

<div class="md:col-6">
<div class="form-field">
<label for="lastName" class="form-label">Last name</label>
<input type="text" class="form-control" id="lasttName">
</div>
</div>

<div class="md:col-6"> 
<div class="form-field">
  <label for="emailfield" class="form-label">Email address</label>
  <input type="email" class="form-control" id="emailfield" placeholder="name@example.com">
  <div class="form-text">
    We’ll never share your email with anyone else.
  </div>
</div>
</div>

<div class="md:col-6"> 
<div class="form-field">
  <label for="exampleFormControlSelect2" class="form-label">Service Type</label>
  <select class="form-control" id="exampleFormControlSelect2">
    <option>Choose one…</option>
    <option value="1">Bird Sitting</option>
    <option value="2">Nail Clipping</option>
    <option value="3">Cage Rentals</option>
    <option value="3">Medication Administration</option>
    <option value="3">DNA Testing</option>
  </select>
</div>
</div>

<div class="form-field">
  <label for="exampleFormControlTextarea1" class="form-label">Message</label>
  <textarea class="form-control" id="exampleFormControlTextarea1"></textarea>
</div>

<div class="form-field">
  <input type="checkbox" id="checkLabel" class="check" />
  <label for="checkLabel">I agree to be contacted</label>
</div>



</div>
<button class="btn-solid theme-primary mt-5">Contact Us</button>
</form>
</div>

</body>

 <div class="container-fluid mt-5">
